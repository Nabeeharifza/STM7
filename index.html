<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Timetable Maker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#667085;--p:#4f46e5;--b:#e3e6ef;--er:#dc2626}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--p);color:#fff;padding:18px 24px}h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.85}
main{max-width:1150px;margin:auto;padding:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.steps button{flex:1;min-width:130px;padding:10px;border:1px solid var(--b);background:var(--c);border-radius:8px;cursor:pointer;text-align:left;font:inherit}
.steps button.on{border-color:var(--p);box-shadow:0 0 0 2px #4f46e533}.steps small{display:block;color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:18px;margin-bottom:14px;overflow-x:auto}
h2{margin:0 0 4px;font-size:18px}h3{margin:16px 0 8px;font-size:15px}.m{color:var(--m);font-size:13px}
label{display:block;font-size:13px;color:var(--m);margin:8px 0 3px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--b);border-radius:6px;background:#fff;max-width:100%}
input[type=number]{width:62px}input[type=checkbox]{width:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:8px 0}
button.b{background:var(--p);color:#fff;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit}
button.b.s{background:#eef0ff;color:var(--p)}button.b.d{background:#fee2e2;color:var(--er)}button.b:disabled{opacity:.45;cursor:not-allowed}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--b);padding:6px 8px;text-align:center;font-size:13px}
th{background:#eef0ff}td.l,th.l{text-align:left}td.blk{background:#fecaca}td.brk{background:#f3f4f6;color:var(--m)}
td.clash{background:#ffedd5!important}td.ed{cursor:grab}td.ed:hover{outline:2px solid var(--p);outline-offset:-2px}td.over{outline:2px dashed var(--p)}
.ma{font-weight:700;font-size:14px;color:#141826}.sb{font-size:11px;color:#475569}.rh{font-weight:700}
.bl button{width:100%;border:0;background:#f0fdf4;padding:6px;cursor:pointer;font:inherit;font-size:12px}.bl button.x{background:#fecaca;color:var(--er)}
.chips label{display:inline-flex;gap:4px;align-items:center;margin:2px 10px 2px 0;color:var(--t)}
.chip{display:inline-flex;gap:6px;align-items:center;background:#eef0ff;color:var(--p);border-radius:14px;padding:2px 10px;margin:2px 4px 2px 0;font-size:13px}.chip a{cursor:pointer;color:var(--er)}
.err{background:#fef2f2;color:var(--er);padding:10px;border-radius:8px;margin:8px 0}.ok{background:#f0fdf4;color:#166534;padding:10px;border-radius:8px;margin:8px 0}
.gr{border:1px solid var(--b);border-radius:8px;padding:12px;margin:10px 0}
details.dt{border:1px solid var(--b);border-radius:10px;background:#fff;margin-bottom:10px}
details.dt>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none}details.dt>summary::-webkit-details-marker{display:none}
details.dt>summary::before{content:'▸';margin-right:8px;color:var(--p)}details.dt[open]>summary::before{content:'▾'}
details.dt>.in{padding:0 16px 16px;overflow-x:auto}
#mod{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;z-index:9}#mod .card{width:340px;margin:0}#mod select{width:100%}
</style></head><body>
<header><h1>School Timetable Maker</h1><p>Set up your school, generate clash-free timetables, drag tiles to rearrange, and download as PDF, Word or Excel.</p></header>
<main><div class="steps" id="nav"></div><div id="panel"></div>
<div class="card"><div class="row"><button class="b" id="genBtn" onclick="gen()">Generate timetable</button>
<button class="b s" onclick="saveFile()">Save data to file</button><button class="b s" onclick="$('#up').click()">Load data from file</button><input type="file" id="up" accept=".json,application/json" style="display:none" onchange="loadFile(this)"><button class="b d" onclick="resetAll()">Reset everything</button><span class="m" id="need"></span></div><div id="msg"></div></div>
<div id="out"></div></main><div id="mod"></div>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],KEY='ttm3',OLD='ttm2';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const def=()=>({school:{name:'',term:'',startDay:0,days:5,periods:8,dur:40,start:'08:00',breaks:[{name:'Break',after:4,dur:20}],ctf:false,layout:'rows'},grades:[],teachers:[],subjects:[],restr:[],par:[],apart:[],ct:{},tt:null,step:1});
let S;try{S=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLD))||def()}catch(e){S=def()}
S=Object.assign(def(),S);
const mig=()=>{S.apart=S.apart||[];S.school.spread=S.school.spread??4;S.teachers.forEach(t=>t.off=t.off||[]);S.apart.forEach(g=>g.id=g.id||uid());S.restr.forEach(r=>{if(Array.isArray(r.cells)){const o={};(r.grades||[]).forEach(g=>o[g]=[...r.cells]);r.cells=o;delete r.grades}r.tg=r.tg||{};r.id=r.id||uid()});
 S.subjects.forEach(s=>{s.id=s.id||uid();s.days=s.days||[];s.per=s.per||{};Object.values(s.per).forEach(p=>{if(!p.ts)p.ts=p.t?[p.t]:[];delete p.t})});S.par.forEach(g=>g.id=g.id||uid())};mig();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const setP=(p,v)=>{const a=p.split('|');let o=S;for(let i=0;i<a.length-1;i++){if(o[a[i]]==null)o[a[i]]={};o=o[a[i]]}o[a[a.length-1]]=v};
const getP=p=>p.split('|').reduce((o,k)=>o==null?o:o[k],S);
const inp=(p,t='text',x='')=>`<input type="${t}" data-p="${esc(p)}" value="${esc(getP(p))}" ${x}>`;
const sel=(p,opts,x='')=>`<select data-p="${esc(p)}" ${x}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(getP(p))==String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
const rng=(a,b)=>Array.from({length:b-a+1},(_,i)=>[a+i,a+i]);
const classes=()=>S.grades.map(g=>({g:g.name,key:g.name}));
const dayName=d=>DAYS[(+S.school.startDay+d)%7];
const PAL=['#C7D2FE','#FBCFE8','#BBF7D0','#FDE68A','#BAE6FD','#FED7AA','#DDD6FE','#FECACA','#A7F3D0','#E9D5FF','#FEF08A','#BFDBFE','#FBD5C8','#CCFBF1','#E0E7FF','#FCE7F3'];
const subCol=n=>PAL[Math.max(0,S.subjects.findIndex(s=>s.name===n))%PAL.length],grCol=n=>PAL[(Math.max(0,S.grades.findIndex(g=>g.name===n))+3)%PAL.length];
const cfg=()=>({D:+S.school.days,P:+S.school.periods,brk:new Set(S.school.breaks.map(b=>+b.after))});
const all=()=>S.tt?Object.values(S.tt).flat():[];
const blks=(c,i)=>(S.tt[c]||[]).filter(b=>i>=b.s&&i<b.s+b.len);
const UI={};
const det=(id,title,body)=>`<details class="dt" ${UI[id]?'open':''} ontoggle="UI['${id}']=this.open"><summary>${title}</summary><div class="in">${body}</div></details>`;
function restr(g,i){const P=+S.school.periods,k=Math.floor(i/P)+'-'+i%P;return S.restr.find(r=>(r.cells[g]||[]).includes(k))}
function restrBlocks(){const{D,P}=cfg(),o=[];S.restr.forEach(r=>S.grades.forEach(g=>(r.cells[g.name]||[]).forEach(k=>{const[d,p]=k.split('-').map(Number);
 if(d<D&&p<P)((r.tg||{})[g.name]||[]).forEach(t=>o.push({id:'r'+o.length,c:'__r',t,s:d*P+p,len:1,rn:r.name,g:g.name}))})));
 S.teachers.forEach(t=>(t.off||[]).forEach(k=>{const[d,p]=k.split('-').map(Number);if(d<D&&p<P)o.push({id:'r'+o.length,c:'__r',t:t.name,s:d*P+p,len:1,rn:'Unavailable',g:'',off:true})}));return o}
function render(){
 const st=status(),names=['School','Grades','Teachers','Subjects','Restrictions & Rules'];
 $('#nav').innerHTML=names.map((n,i)=>`<button class="${S.step==i+1?'on':''}" onclick="S.step=${i+1};save();render()">${i+1}. ${n}<small>${st[i]}</small></button>`).join('');
 $('#panel').innerHTML=[p1,p2,p3,p4,p5][S.step-1]();
 document.querySelectorAll('[data-p]').forEach(e=>e.onchange=()=>{
  setP(e.dataset.p,e.type==='checkbox'?e.checked:e.type==='number'?(e.value===''?'':+e.value):e.value);save();e.dataset.r?render():need()});
 need();renderOut();
}
function status(){const sc=S.school;S._ok=[!!sc.name.trim(),S.grades.length>0,S.teachers.length>0,S.subjects.some(x=>Object.values(x.per||{}).some(v=>+v.n))];
 return[sc.name?'Done':'Required',S.grades.length+' grades',S.teachers.length+' teachers',S.subjects.length+' subjects',S.restr.length+' restrictions · '+S.par.length+' parallel · '+S.apart.length+' keep-apart'];}
function need(){const ok=S._ok||[],miss=['school name','grades','teachers','subject periods'].filter((_,i)=>!ok[i]);
 $('#genBtn').disabled=miss.length>0;$('#need').textContent=miss.length?'Need: '+miss.join(', '):'Ready to generate';}
function times(){const sc=S.school,[h,m]=sc.start.split(':').map(Number);let t=h*60+m;const f=x=>String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0'),items=[];
 for(let p=0;p<sc.periods;p++){items.push({t:'p',i:p,label:`P${p+1}\n${f(t)}-${f(t+ +sc.dur)}`});t+=+sc.dur;
  sc.breaks.filter(b=>+b.after==p+1).forEach(b=>{items.push({t:'b',label:`${b.name||'Break'}\n${f(t)}-${f(t+ +b.dur)}`});t+=+b.dur})}
 return{items,end:f(t)};}
/* ---------- steps ---------- */
function p1(){const sc=S.school,tm=times();
 return`<div class="card"><h2>School</h2><p class="m">Name, teaching days, periods and hours.</p>
 <div class="g"><div><label>School name *</label>${inp('school|name')}</div><div><label>Term / academic year</label>${inp('school|term')}</div>
 <div><label>Week starts on</label>${sel('school|startDay',DAYS.map((d,i)=>[i,d]),'data-r=1')}</div>
 <div><label>Days per week</label>${sel('school|days',rng(2,7),'data-r=1')}</div>
 <div><label>Periods per day</label>${sel('school|periods',rng(4,10),'data-r=1')}</div>
 <div><label>Period duration (min)</label>${inp('school|dur','number','data-r=1')}</div>
 <div><label>Start time</label>${inp('school|start','time','data-r=1')}</div>
 <div><label>Timetable layout</label>${sel('school|layout',[['rows','Days in rows'],['cols','Days in columns']])}</div></div>
 <h3>Breaks</h3>${sc.breaks.map((b,i)=>`<div class="row">${inp('school|breaks|'+i+'|name','text','placeholder=Name data-r=1')}<span class="m">after period</span>${sel('school|breaks|'+i+'|after',rng(1,sc.periods-1),'data-r=1')}${inp('school|breaks|'+i+'|dur','number','data-r=1')}<span class="m">min</span><button class="b d" onclick="S.school.breaks.splice(${i},1);save();render()">Remove</button></div>`).join('')}
 <button class="b s" onclick="S.school.breaks.push({name:'Break',after:1,dur:15});save();render()">+ Add break</button>
 <h3>Rules</h3><label class="chips"><input type="checkbox" data-p="school|ctf" ${sc.ctf?'checked':''}> Class teacher takes the first period (when possible)</label>
 <div class="row"><div><label>Teacher spacing (avoid long runs of back-to-back lessons and long free gaps)</label>${sel('school|spread',[[0,'Off'],[2,'Light'],[4,'Normal'],[8,'Strong']])}</div></div>
 <p class="m">Preview: ${sc.start} → ${tm.end} · ${sc.periods} periods · ${dayName(0)} – ${dayName(sc.days-1)}</p>
 <button class="b" onclick="S.step=2;save();render()">Next: Grades →</button></div>`}
function p2(){return`<div class="card"><h2>Grades</h2><p class="m">Add grades one by one. You can add more at any time without redoing anything else.</p>
 <div class="row"><div><label>Grade name</label><input id="gN" placeholder="e.g. Grade 6"></div><button class="b" onclick="addG()">Add grade</button></div>
 ${S.grades.map((g,i)=>`<span class="gr" style="display:inline-block;margin:4px">${esc(g.name)} <button class="b d" onclick="delG(${i})">✕</button></span>`).join('')||'<p class="m">No grades yet.</p>'}</div>`}
function addG(){const n=$('#gN').value.trim();if(n&&!S.grades.some(g=>g.name===n))S.grades.push({name:n});save();render()}
function delG(i){const n=S.grades[i].name;if(!confirm('Delete '+n+'?'))return;S.grades.splice(i,1);S.subjects.forEach(s=>delete s.per[n]);S.restr.forEach(r=>{delete r.cells[n];delete r.tg[n]});S.par.forEach(g=>g.mem=g.mem.filter(m=>m.g!==n));S.apart.forEach(g=>g.mem=g.mem.filter(m=>m.g!==n));delete S.ct[n];if(S.tt)delete S.tt[n];save();render()}
function p3(){return`<div class="card"><h2>Teachers</h2><p class="m">Just a list of names. You choose who teaches what in the Subjects step. Renaming here updates everywhere.</p>
 <div class="row"><div><label>Teacher name</label><input id="tN"></div><button class="b" onclick="addT()">Add teacher</button></div>
 <table><tr><th class="l">Name</th><th>Lessons / week</th><th>Max / day</th><th>Max in a row</th><th></th></tr>${S.teachers.map((t,i)=>`<tr><td class="l"><input value="${esc(t.name)}" onchange="renT(${i},this.value)">${wlLine(t.name)}</td>${wlCells(t.name)}<td>${inp('teachers|'+i+'|maxDay','number','min=1')}</td><td>${inp('teachers|'+i+'|maxRow','number','min=1')}</td><td><button class="b d" onclick="delT(${i})">✕</button></td></tr>`).join('')}</table><p class="m">Leave Max fields blank for no limit. Open a teacher below to block days/periods they can't work (e.g. part-timers).</p></div>
 ${S.teachers.map((t,i)=>det('tav'+i,esc(t.name)+' – availability'+((t.off||[]).length?` <span class="m">· ${t.off.length} periods blocked</span>`:''),offGrid(i))).join('')}`}
function workload(name){const sc=S.school,by={};let n=0;S.subjects.forEach(sb=>S.grades.forEach(g=>{const v=(sb.per||{})[g.name];if(v&&+v.n&&(v.ts||[]).includes(name)){by[sb.name]=(by[sb.name]||0)+ +v.n;n+=+v.n}}));
 all().forEach(b=>{if(coT(b).includes(name)){by[b.sub+' (extra)']=(by[b.sub+' (extra)']||0)+b.len;n+=b.len}});const rb=restrBlocks().filter(x=>x.t===name),dl=rb.filter(x=>!x.off),off=rb.length-dl.length;dl.forEach(x=>{by[x.rn]=(by[x.rn]||0)+1});n+=dl.length;return{n,by,duty:dl.length,free:sc.days*sc.periods-n-off}}
const wlLine=name=>{const w=workload(name),a=Object.entries(w.by).map(([k,v])=>esc(k)+' '+v).join(' · ');return a?`<div class="m" style="font-size:12px;margin-top:3px">${a}</div>`:''};
const wlCells=name=>{const w=workload(name);return`<td><b>${w.n}</b></td>`};
const offGrid=ti=>{const t=S.teachers[ti],sc=S.school,o=t.off||[];return`<table class="bl"><tr><th></th>${Array.from({length:+sc.periods},(_,p)=>`<th>P${p+1}</th>`).join('')}</tr>${Array.from({length:+sc.days},(_,d)=>`<tr><th class="l">${dayName(d)}</th>${Array.from({length:+sc.periods},(_,p)=>{const x=o.includes(d+'-'+p);return`<td style="padding:0"><button class="${x?'x':''}" onclick="tgO(${ti},${d},${p})">${x?'Off':'Free'}</button></td>`}).join('')}</tr>`).join('')}</table><p class="m">Red = this teacher can't be given lessons then.</p>`};
function tgO(ti,d,p){const t=S.teachers[ti];t.off=t.off||[];const k=d+'-'+p,j=t.off.indexOf(k);j<0?t.off.push(k):t.off.splice(j,1);save();render()}
function addT(){const n=$('#tN').value.trim();if(n&&!S.teachers.some(t=>t.name===n))S.teachers.push({name:n,off:[]});save();render()}
const mapT=f=>{S.subjects.forEach(s=>Object.values(s.per).forEach(p=>p.ts=f(p.ts||[])));S.restr.forEach(r=>{for(const g in r.tg)r.tg[g]=f(r.tg[g])});for(const g in S.ct)if(!f([S.ct[g]]).length)S.ct[g]=''};
function renT(i,v){v=v.trim();const o=S.teachers[i].name;if(!v||S.teachers.some(t=>t.name===v)){render();return}S.teachers[i].name=v;mapT(a=>a.map(x=>x===o?v:x));for(const g in S.ct)if(S.ct[g]===o)S.ct[g]=v;all().forEach(b=>{if(b.t===o)b.t=v;if(b.ts)b.ts=b.ts.map(x=>x===o?v:x)});save();render()}
function delT(i){const o=S.teachers[i].name;if(!confirm('Delete '+o+'? Their subject and restriction assignments will be cleared.'))return;S.teachers.splice(i,1);mapT(a=>a.filter(x=>x!==o));save();render()}
const tsPick=(arr,addFn,rmFn)=>{const av=S.teachers.filter(t=>!arr.includes(t.name));return arr.map((n,k)=>`<span class="chip">${esc(n)}<a onclick="${rmFn}(${k})">✕</a></span>`).join('')+(av.length?`<select onchange="${addFn}(this.value)"><option value="">+ add teacher</option>${av.map(t=>`<option>${esc(t.name)}</option>`).join('')}</select>`:'')};
const perOf=(si,gi)=>{const s=S.subjects[si],g=S.grades[gi].name;s.per[g]=s.per[g]||{};s.per[g].ts=s.per[g].ts||[];return s.per[g]};
const coT=b=>{const v=((S.subjects.find(x=>x.name===b.sub)||{}).per||{})[b.c],P=+S.school.periods;return v&&v.co&&v.co.t&&(v.co.days||[]).includes(Math.floor(b.s/P))?[v.co.t]:[]};
const tset=b=>[b.t,...coT(b)];
function setCo(si,gi,v){const p=perOf(si,gi);if(!v)delete p.co;else p.co={t:v,days:(p.co&&p.co.days)||[]};save();render()}
function tgCo(si,gi,d){const p=perOf(si,gi);if(!p.co)return;const a=p.co.days,j=a.indexOf(d);j<0?a.push(d):a.splice(j,1);save();render()}
const coUI=(si,gi,p)=>{const c=p.co;return`<select onchange="setCo(${si},${gi},this.value)"><option value="">none</option>${S.teachers.map(t=>`<option ${c&&c.t===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`+(c?`<div style="margin-top:4px">${Array.from({length:+S.school.days},(_,d)=>`<label class="chips" style="cursor:pointer"><input type="checkbox" ${(c.days||[]).includes(d)?'checked':''} onchange="tgCo(${si},${gi},${d})"> ${dayName(d).slice(0,3)}</label>`).join('')}</div>`:'')};
function addTs(si,gi,v){if(!v)return;const p=perOf(si,gi);if(!p.ts.includes(v))p.ts.push(v);save();render()}
function rmTs(si,gi,k){perOf(si,gi).ts.splice(k,1);save();render()}
function p4(){if(!S.grades.length||!S.teachers.length)return'<div class="card"><h2>Subjects</h2><p class="m">Add at least one grade and one teacher first.</p></div>';
 return`<div class="card"><h2>Subjects</h2><p class="m">Add a subject, then open it to set, for each grade, the periods per week, how many are <b>double periods</b> (always back-to-back, never split by a break) and the teacher(s). If you assign several teachers to one subject in a grade, the lessons are shared between them automatically.</p>
 <div class="row"><div><label>Subject name</label><input id="sN"></div><button class="b" onclick="addS()">Add subject</button></div></div>
 ${S.subjects.map((s,i)=>det(s.id,esc(s.name),`<div class="row"><div><label>Subject name</label><input value="${esc(s.name)}" onchange="renS(${i},this.value)"></div><button class="b d" onclick="delS(${i})">Delete subject</button></div>
 <label>Only on these days (leave all unticked for any day)</label><div class="chips">${Array.from({length:+S.school.days},(_,d)=>`<label><input type="checkbox" ${(s.days||[]).includes(d)?'checked':''} onchange="togD(${i},${d},this.checked)"> ${dayName(d)}</label>`).join('')}</div>
